device: cuda
model_name: graph-512-8-GAT-CLS
seed: 42
train:
  dataset: hecbench
  epochs: 1000
  batch_size: 16
  world_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  train_from_checkpoint: false
  optimizer: AdamW
  scheduler:
    name: linear
test:
  dataset: hecbench
  batch_size: 16
  checkpoint:
    dir: /tmp/checkpoints
    file_name: hecbench_test_checkpoint.pth